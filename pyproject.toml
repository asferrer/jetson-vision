[project]
name = "jetson-vision"
version = "0.1.0"
description = "Real-time marine debris detection module for a small underwater robot on Jetson Orin Nano"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[project.scripts]
jv = "jetson_vision.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jetson_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["tools/reference", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["B905"]  # zip() over equal-length sequences by construction
